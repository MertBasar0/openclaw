name: CevizWatch
knownRegions:
  - en
  - tr
  - Base
options:
  bundleIdPrefix: com.mertbasar
  generateEmptyDirectories: true
  # Temel dil Ingilizce (hedef pazar); Turkce ceviri olarak sunulur.
  developmentLanguage: en
  deploymentTarget:
    iOS: "16.0"
    watchOS: "9.0"
settings:
  base:
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    APP_MARKETING_VERSION: "2026.6.5"
    APP_PROJECT_VERSION: "6"
    IOS_BUNDLE_ID: com.mertbasar.cevizwatch
    WATCH_BUNDLE_ID: com.mertbasar.cevizwatch.watchkitapp

targets:
  CevizBridge:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: ios-bridge
    settings:
      base:
        # Gercek Info.plist kullaniliyor: CFBundleURLTypes ve
        # NSAppTransportSecurity gibi ic ice yapilar INFOPLIST_KEY_* build
        # ayarlariyla yazilamiyor, sessizce dusuyordu.
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ios-bridge/Info.plist
        CURRENT_PROJECT_VERSION: $(APP_PROJECT_VERSION)
        MARKETING_VERSION: $(APP_MARKETING_VERSION)
        PRODUCT_BUNDLE_IDENTIFIER: com.mertbasar.cevizwatch
        PRODUCT_NAME: CevizBridge
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: "YES"
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: CevizWatchApp
        embed: true

  CevizWatchApp:
    type: application
    platform: watchOS
    deploymentTarget: "9.0"
    sources:
      - path: apple-watch
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: apple-watch/Info.plist
        CURRENT_PROJECT_VERSION: $(APP_PROJECT_VERSION)
        MARKETING_VERSION: $(APP_MARKETING_VERSION)
        PRODUCT_BUNDLE_IDENTIFIER: com.mertbasar.cevizwatch.watchkitapp
        PRODUCT_NAME: CevizWatchApp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
        CODE_SIGNING_ALLOWED: "YES"

schemes:
  CevizBridge:
    build:
      targets:
        CevizBridge: all
    run:
      config: Release
    archive:
      config: Release
