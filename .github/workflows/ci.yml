name: macOS real app menu proof
on:
  push:
    branches: [codex/195439-real-app-proof-20261109]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    if: github.repository == 'MertBasar0/openclaw' && github.event.repository.private == false
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: MertBasar0/openclaw
          ref: 19b8bfa3823eed877b7e630e57fb9f669a1a5671
          fetch-depth: 2
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
      - name: Verify existing desktop access
        run: bash harness/.proof/189892/desktop-preflight.sh "$GITHUB_WORKSPACE/harness/.proof/189892" "$GITHUB_WORKSPACE/evidence/preflight"
      - name: Prepare real products and external menu driver
        run: bash harness/.proof/189892/real-app-build.sh prepare "$GITHUB_WORKSPACE/source" "$GITHUB_WORKSPACE/harness/.proof/189892" "$GITHUB_WORKSPACE/evidence/build"
      - name: Build original menu behavior
        run: bash harness/.proof/189892/real-app-build.sh baseline "$GITHUB_WORKSPACE/source" "$GITHUB_WORKSPACE/harness/.proof/189892" "$GITHUB_WORKSPACE/evidence/build"
      - name: Real baseline app and Gateway proof
        run: python3 harness/.proof/189892/real-app-proof.py --source "$GITHUB_WORKSPACE/source" --kit "$GITHUB_WORKSPACE/harness/.proof/189892" --out "$GITHUB_WORKSPACE/evidence/baseline" --variant baseline
      - name: Build unchanged PR candidate
        run: bash harness/.proof/189892/real-app-build.sh candidate "$GITHUB_WORKSPACE/source" "$GITHUB_WORKSPACE/harness/.proof/189892" "$GITHUB_WORKSPACE/evidence/build"
      - name: Real candidate app and Gateway proof
        run: python3 harness/.proof/189892/real-app-proof.py --source "$GITHUB_WORKSPACE/source" --kit "$GITHUB_WORKSPACE/harness/.proof/189892" --out "$GITHUB_WORKSPACE/evidence/candidate" --variant candidate
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: real-app-menu-proof
          path: evidence
          retention-days: 14
          if-no-files-found: error
