name: macOS real app desktop preflight
on:
  push:
    branches: [codex/195439-real-app-proof-20261109]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    if: github.repository == 'MertBasar0/openclaw' && github.event.repository.private == false
    runs-on: macos-26
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          path: harness
          persist-credentials: false
      - name: Inspect supported desktop access without changing permissions
        shell: bash
        run: bash "$GITHUB_WORKSPACE/harness/.proof/189892/desktop-preflight.sh" "$GITHUB_WORKSPACE/harness/.proof/189892" "$GITHUB_WORKSPACE/evidence"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: real-app-desktop-preflight
          path: evidence
          retention-days: 14
          if-no-files-found: error
