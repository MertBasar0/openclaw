name: macOS inherited checkmark continuation proof
on:
  push:
    branches: [codex/189892-continuation-proof-20261109]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    if: github.repository == 'MertBasar0/openclaw' && github.event.repository.private == false
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: MertBasar0/openclaw
          ref: 19b8bfa3823eed877b7e630e57fb9f669a1a5671
          path: source
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
      - name: Verify exact candidate and prepare worker
        id: prepare
        shell: bash
        run: bash "$GITHUB_WORKSPACE/harness/.proof/189892/continuation.sh" prepare "$GITHUB_WORKSPACE/source" "$GITHUB_WORKSPACE/harness/.proof/189892" "$GITHUB_WORKSPACE/evidence"
      - name: Baseline regression must fail for the expected checkmarks
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        shell: bash
        run: bash "$GITHUB_WORKSPACE/harness/.proof/189892/continuation.sh" baseline "$GITHUB_WORKSPACE/source" "$GITHUB_WORKSPACE/harness/.proof/189892" "$GITHUB_WORKSPACE/evidence"
      - name: Candidate native app, tests and focused suites
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        shell: bash
        run: bash "$GITHUB_WORKSPACE/harness/.proof/189892/continuation.sh" candidate "$GITHUB_WORKSPACE/source" "$GITHUB_WORKSPACE/harness/.proof/189892" "$GITHUB_WORKSPACE/evidence"
      - name: Required Swift checks
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        shell: bash
        run: bash "$GITHUB_WORKSPACE/harness/.proof/189892/continuation.sh" static "$GITHUB_WORKSPACE/source" "$GITHUB_WORKSPACE/harness/.proof/189892" "$GITHUB_WORKSPACE/evidence"
      - name: Verify final source identity
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        shell: bash
        run: bash "$GITHUB_WORKSPACE/harness/.proof/189892/continuation.sh" receipt "$GITHUB_WORKSPACE/source" "$GITHUB_WORKSPACE/harness/.proof/189892" "$GITHUB_WORKSPACE/evidence"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: inherited-checkmark-continuation-evidence
          path: evidence
          retention-days: 14
          if-no-files-found: error
