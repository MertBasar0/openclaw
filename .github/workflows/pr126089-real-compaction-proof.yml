name: PR 126089 real compaction proof

on:
  push:
    branches: [proof/pr126089-real-compaction]

permissions:
  contents: read

jobs:
  changed-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Fetch current validation base
        run: >-
          git fetch --no-tags --depth=1 https://github.com/openclaw/openclaw.git
          main:refs/remotes/origin/main
      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"
          use-actions-cache: "true"
      - name: Run changed-file validation
        run: >-
          pnpm check:changed -- src/agents/agent-hooks/compaction-safeguard-quality.ts
          src/agents/agent-hooks/compaction-safeguard.test.ts

  real-gateway-compaction:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"
          use-actions-cache: "true"
      - name: Build QA runtime
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          OPENCLAW_BUILD_PRIVATE_QA: "1"
        run: pnpm build qaRuntime
      - name: Run decimal-heavy real Gateway compaction
        env:
          NODE_OPTIONS: --max-old-space-size=16384
          OPENCLAW_BUILD_PRIVATE_QA: "1"
          OPENCLAW_ENABLE_PRIVATE_QA_CLI: "1"
          OPENCLAW_QA_REDACT_PUBLIC_METADATA: "1"
          OPENCLAW_QA_TRANSPORT_READY_TIMEOUT_MS: "180000"
        run: |
          pnpm openclaw qa suite \
            --repo-root . \
            --provider-mode mock-openai \
            --concurrency 1 \
            --scenario compaction-retry-mutating-tool \
            --output-dir .artifacts/qa-e2e/pr126089-real-compaction
      - name: Upload redacted QA evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr126089-real-compaction-${{ github.sha }}
          path: .artifacts/qa-e2e/pr126089-real-compaction/
          if-no-files-found: warn
          retention-days: 30
